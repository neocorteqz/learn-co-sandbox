<VirtualHost *:80>
    ServerName panel.example.com
    DocumentRoot /var/www/minecraft-panel/public

    <Directory /var/www/minecraft-panel/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # PHP 8.5-FPM. Enable proxy_fcgi, setenvif, and rewrite first.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    <FilesMatch "(^\.|\.(?:env|ini|log|sql|bak|dist))$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/minecraft-panel-error.log
    CustomLog ${APACHE_LOG_DIR}/minecraft-panel-access.log combined
</VirtualHost>
